<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2d72d2" />
    <meta
      name="description"
      content="Backpack mirrors software packages and their dependencies for offline and air-gapped use."
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Backpack</title>
  </head>
  <body>
    <script>
      // Apply the saved (or OS) theme before the app loads to avoid a flash
      // of the wrong theme. Mirrors src/app/context/ThemeContext.tsx.
      (function () {
        var dark = true;
        try {
          var saved = localStorage.getItem('blueprintjs-dark-mode');
          if (saved !== null) {
            dark = JSON.parse(saved) === true;
          } else if (window.matchMedia) {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch (e) {}
        // Must match Blueprint's Classes.DARK.
        if (dark) document.body.classList.add('bp6-dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <noscript>You need to enable JavaScript to run Backpack.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
